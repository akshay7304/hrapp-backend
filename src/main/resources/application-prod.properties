# ─────────────────────────────────────────────
#  HR APP — Production (real clients — future)
# ─────────────────────────────────────────────
#
# Use a SEPARATE Supabase project from local/dev.
# Activate with SPRING_PROFILES_ACTIVE=prod when you have a paying client.
#
# Required env vars:
#   JWT_SECRET          — strong random string (weak default refused)
#   DB_URL / DB_USERNAME / DB_PASSWORD
#   CORS_ALLOWED_ORIGINS — production FE origin(s)

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

spring.jackson.time-zone=Asia/Kolkata

# Hide OpenAPI UI in real production by default.
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}

logging.level.com.hrapp=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO

# ─────────────────────────────────────────────
#  HR APP — Production (Render / Docker)
# ─────────────────────────────────────────────
#
# Required env vars:
#   JWT_SECRET          — strong random string, >= 32 bytes (no default)
#   DB_URL / DB_USERNAME / DB_PASSWORD
#   SPRING_PROFILES_ACTIVE=prod  (set in Dockerfile)

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JVM runs in UTC on Render by default — align app + JSON with India time.
spring.jackson.time-zone=Asia/Kolkata

# Hide OpenAPI UI in production.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

logging.level.com.hrapp=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO

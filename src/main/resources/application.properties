# ─────────────────────────────────────────────
#  HR APP — Spring Boot Configuration
# ─────────────────────────────────────────────

# Active profile:
#   local — laptop (application-local.properties, gitignored)
#   dev   — Render / shared Supabase (default in Dockerfile)
#   prod  — future real-client deploy (separate Supabase)
# Override via SPRING_PROFILES_ACTIVE env var.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Server
server.port=${PORT:8080}
server.servlet.context-path=/api/v1

# ─── Database ────────────────────────────────
# Local: set in application-local.properties (gitignored) — same Supabase as dev for now.
# Dev/Prod (Render): set DB_URL, DB_USERNAME, DB_PASSWORD.
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ─────────────────────────
spring.jpa.hibernate.ddl-auto=validate
# SQL logging off by default; enable in application-local.properties when needed.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ─── Jackson / time ──────────────────────────
# All LocalDateTime values are IST wall clock (see JacksonConfig).
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.serialization.write-dates-as-timestamps=false

# ─── JWT ─────────────────────────────────────
# No weak default here. Local: set in application-local.properties.
# Dev/Prod on Render: set JWT_SECRET. Profile "prod" refuses the known weak default.
app.jwt.secret=${JWT_SECRET:}
# Access token: default 1 day. Override via JWT_ACCESS_EXPIRATION_MS (milliseconds).
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:86400000}
# Refresh token: default 7 days
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ─── Flyway ──────────────────────────────────
# V1 = full PostgreSQL baseline (squashed). Use a fresh Supabase DB — do not
# replay against old MySQL flyway history.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

# ─── Swagger / OpenAPI ───────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.packagesToScan=com.hrapp.controller
springdoc.paths-to-match=/**
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.tagsSorter=alpha
springdoc.show-actuator=false

# ─── CORS (web / PWA) ────────────────────────
# Comma-separated browser origins. Override via CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ─── Logging ─────────────────────────────────
logging.level.com.hrapp=INFO
logging.level.org.springframework.security=WARN


# ─── HikariCP Connection Pool ────────────────
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=HrAppHikariPool
spring.datasource.hikari.auto-commit=true

# ─── JPA Performance ─────────────────────────
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true


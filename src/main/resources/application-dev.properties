# ─────────────────────────────────────────────
#  HR APP — Dev (Render staging / shared Supabase)
# ─────────────────────────────────────────────
#
# Same DB as local for now. Later: point Render DB_* at a
# dedicated Supabase project; keep true clients on profile "prod".
#
# Required env vars on Render:
#   JWT_SECRET
#   DB_URL / DB_USERNAME / DB_PASSWORD
#   SPRING_PROFILES_ACTIVE=dev

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Supabase free tier — keep pool small.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.jackson.time-zone=Asia/Kolkata

# Swagger on for FE integration (override with SPRINGDOC_ENABLED=false).
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}

logging.level.com.hrapp=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO

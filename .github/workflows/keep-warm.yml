# Pings the Render public health endpoint so the free-tier web service
# does not spin down after ~15 minutes of idle traffic.
#
# Setup (once):
#   GitHub repo → Settings → Secrets and variables → Actions → Variables
#   Add KEEP_WARM_URL = https://<your-render-host>/api/v1/health
#
# Note: GitHub cron is best-effort (often delayed hours, not exact */10).
# If the service is cold, Render wake-up can take >60s — use a long timeout.
#
name: Keep Render warm

on:
  schedule:
    # Requested every 10 minutes (UTC). GitHub may delay this significantly.
    - cron: "*/10 * * * *"
  workflow_dispatch: # allow manual run from Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          KEEP_WARM_URL: ${{ vars.KEEP_WARM_URL }}
        run: |
          if [ -z "$KEEP_WARM_URL" ]; then
            echo "KEEP_WARM_URL is not set. Add it under Settings → Variables → Actions."
            exit 1
          fi
          echo "Pinging $KEEP_WARM_URL"
          # --max-time 180: allow Render cold start
          # --retry 3: retry on timeout / transient failures
          curl -fsS \
            --max-time 180 \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            -o /tmp/health.json \
            -w "HTTP %{http_code} in %{time_total}s\n" \
            "$KEEP_WARM_URL"
          cat /tmp/health.json
          echo
